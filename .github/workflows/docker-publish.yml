name: Build and Publish Docker Images

on:
  push:
    branches: [main]
    tags: ['v*']
  release:
    types: [published]
  # Build any branch on demand, matching aegis (build-aegis.yml) and both
  # obilabs-platform workflows. Without this, a Helios branch could not be built
  # into an image at all, so a change could only be verified AFTER merging to
  # main — the one product where "merge and hope" was the only option.
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # MUST stay under `ghcr.io/<owner>/<repo>/...`. GITHUB_TOKEN can only create a
  # package that GitHub can associate with this repository by name, and that
  # association is derived from the image path.
  #
  # This was `${{ github.repository_owner }}/helios` + a `-backend` / `-frontend`
  # suffix, producing `ghcr.io/obilabs/helios-backend`. That is a sibling package
  # to the repo, not a child of it, so every push since 2026-08-11 died with
  # `403 Forbidden` on the blob HEAD and NO helios image was ever published —
  # while the workflow's own build steps looked fine. Using ${{ github.repository }}
  # yields `ghcr.io/obilabs/helios/backend`, which matches how obilabs-platform
  # publishes web/mtp and aegis publishes its single image.
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

# Least privilege: the workflow token can only read the repo. Jobs that need
# more (packages: write to publish, security-events: write to upload findings)
# raise it for themselves, so a compromised step in any other job cannot write.
permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for backend
        id: meta-backend
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/backend
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # `sha-` prefix, matching aegis and obilabs-platform. Helios emitted a
            # BARE sha, so `sha-<commit>` (the tag every runbook and compose file
            # in the other repos uses) simply did not exist here — a pull that
            # should have been muscle memory failed instead.
            type=sha,prefix=sha-
            # edge on main, latest ONLY on a v* tag.
            #
            # This previously published `latest` from every merge to main, which
            # contradicts the release policy in obilabs-platform/CLAUDE.md: main
            # is not a release channel, and a tag that moves is not a version.
            # Pinning `latest` for a deployment therefore tracked main under a
            # stable-looking name.
            type=raw,value=edge,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Extract metadata for frontend
        id: meta-frontend
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/frontend
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # `sha-` prefix, matching aegis and obilabs-platform. Helios emitted a
            # BARE sha, so `sha-<commit>` (the tag every runbook and compose file
            # in the other repos uses) simply did not exist here — a pull that
            # should have been muscle memory failed instead.
            type=sha,prefix=sha-
            # edge on main, latest ONLY on a v* tag.
            #
            # This previously published `latest` from every merge to main, which
            # contradicts the release policy in obilabs-platform/CLAUDE.md: main
            # is not a release channel, and a tag that moves is not a version.
            # Pinning `latest` for a deployment therefore tracked main under a
            # stable-looking name.
            type=raw,value=edge,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push backend
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Build and push frontend
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          build-args: |
            VITE_API_URL=
            VITE_DEFAULT_THEME=helios-purple
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
