name: OpenSSF Scorecard

# Scores the repo's security posture (branch protection, code review, dependency
# update tooling, CI-tests, dangerous workflow patterns, etc.) and publishes results
# to the Security tab. Enables the Scorecard badge — the strongest single "verify,
# don't trust" signal for a security-conscious audience.

on:
  branch_protection_rule:
  schedule:
    - cron: "18 5 * * 2" # weekly, Tuesdays
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true # required for the public badge
      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3
        with:
          sarif_file: results.sarif
