name: CodeQL

# Static analysis for security vulnerabilities. Results surface in the repo's
# Security tab (Code scanning alerts) — a public, verifiable signal.
#
# ── WHY THIS IS MANUAL-ONLY RIGHT NOW (2026-08-17) ──────────────────────────
# This workflow failed on EVERY run from 2026-08-11 onward. Not a code problem:
#
#     Advanced Security must be enabled for this repository to use code scanning
#
# Code scanning requires GitHub Advanced Security on a PRIVATE repository. It is
# free on PUBLIC repositories. `obilabs/helios` is private, GHAS is not enabled,
# so CodeQL literally cannot upload results — every run is red before it starts.
#
# Verification Rule 4: red is red. A permanently-failing check is WORSE than no
# check, because it trains everyone to ignore the signal — and it did: this sat
# red for six days across every branch while "security scanning" looked
# configured. So the automatic triggers are removed rather than left failing.
#
# TO RE-ENABLE, pick one:
#   1. Make the repo public. Helios is AGPL-3.0 and intended to be public, so
#      this is likely the real answer and costs nothing. CodeQL then just works.
#   2. Enable GitHub Advanced Security on the private repo (paid).
# Then restore the `push` / `pull_request` / `schedule` triggers below.
#
# Two real bugs were ALSO fixed here, which would have bitten immediately after
# whichever of those is chosen:
#   * `language:` -> `languages:`. The action reported "Unexpected input(s)
#     'language'" and ignored it. The input has always been plural.
#   * v3 -> v4. CodeQL Action v3 is deprecated in December 2026.

on:
  # Automatic triggers deliberately disabled — see the note above. Restore
  # these together with GHAS (or with the repo going public):
  #   push:
  #     branches: [main]
  #   pull_request:
  #     branches: [main]
  #   schedule:
  #     - cron: "27 4 * * 1"
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: ["javascript-typescript"]
    steps:
      - uses: actions/checkout@v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          # PLURAL. `language:` was silently ignored ("Unexpected input(s)").
          languages: ${{ matrix.language }}
          queries: security-and-quality
      - name: Autobuild
        uses: github/codeql-action/autobuild@v4
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
