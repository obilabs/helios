name: CodeQL

# Static analysis. Results surface in the repo's Security tab (Code scanning
# alerts) — a public, verifiable signal.
#
# Runs on every push to main, every PR targeting main, and weekly (so new
# query packs are applied to unchanged code too). Code scanning is free on
# public repositories; the triggers were manual-only while the repo was private.
#
# Two input details worth keeping:
#   * `languages:` is plural — `language:` is silently ignored
#     ("Unexpected input(s)").
#   * v4 of the CodeQL Action; v3 is deprecated in December 2026.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "27 4 * * 1"
  workflow_dispatch:

# Least privilege: the workflow token can only read the repo. Jobs that need
# more (packages: write to publish, security-events: write to upload findings)
# raise it for themselves, so a compromised step in any other job cannot write.
permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: ["javascript-typescript"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          # PLURAL. `language:` was silently ignored ("Unexpected input(s)").
          languages: ${{ matrix.language }}
          queries: security-and-quality
      - name: Autobuild
        uses: github/codeql-action/autobuild@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
