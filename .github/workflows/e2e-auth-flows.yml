name: E2E Auth Flows

# Browser coverage for the first-run screens the headless/API tests skip (setup
# wizard, login form) plus a signed-in settings save, which exercises session
# cookies and the CSRF token end to end. It builds and boots the whole docker
# stack + a real browser, so it runs on application source changes (backend,
# frontend, e2e, compose, nginx) and is always available via manual dispatch.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'backend/src/**'
      - 'backend/package*.json'
      - 'backend/Dockerfile*'
      - 'frontend/src/**'
      - 'frontend/package*.json'
      - 'frontend/Dockerfile*'
      - 'e2e/**'
      - 'docker-compose.yml'
      - 'nginx/**'
      - 'database/**'
      - '.github/workflows/e2e-auth-flows.yml'
  push:
    branches: [main]
    paths:
      - 'backend/src/**'
      - 'backend/package*.json'
      - 'backend/Dockerfile*'
      - 'frontend/src/**'
      - 'frontend/package*.json'
      - 'frontend/Dockerfile*'
      - 'e2e/**'
      - 'docker-compose.yml'
      - 'nginx/**'
      - 'database/**'

permissions:
  contents: read

jobs:
  auth-flows:
    name: Setup wizard + login (browser)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      # Brings up a fresh, isolated, disposable stack (no DEFAULT_ADMIN -> setup
      # wizard is served), waits for health, runs the Playwright auth-flows
      # config, then tears the stack down with `down -v`. Same script as local.
      - name: Run auth-flows E2E
        run: bash e2e/run-auth-flows.sh

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: auth-flows-playwright-report
          path: e2e/playwright-report-auth-flows
          if-no-files-found: ignore
          retention-days: 7
