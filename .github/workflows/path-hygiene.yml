name: Path Hygiene

# Enforces PRINCIPLES.md #4: no machine-specific home-directory paths committed
# (portability + privacy). Fast, build-free guard — runs on every PR and push to main.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  no-absolute-paths:
    name: No absolute machine paths
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tracked files
        run: bash tools/check-abspaths.sh .
