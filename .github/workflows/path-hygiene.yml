name: Path Hygiene

# Enforces PRINCIPLES.md #4: no machine-specific home-directory paths committed
# (portability + privacy). Fast, build-free guard — runs on every PR and push to main.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  no-absolute-paths:
    name: No absolute machine paths
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tracked files
        run: bash tools/check-abspaths.sh .

  no-committed-credentials:
    name: No committed credentials
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Scan tracked files for credentials
        run: node scripts/check-no-secrets.mjs
