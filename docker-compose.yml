# Helios Client - Default Docker Compose (Production)
# Usage: docker compose up -d
#
# This is the default production configuration.
# For development with hot-reload, use: docker compose -f docker-compose.dev.yml up -d
#
# Security: Only nginx is accessible from outside the docker network.
# All other services communicate internally via helios_network.
#
# Required environment variables (set in .env file):
#   DB_PASSWORD, JWT_SECRET, ENCRYPTION_KEY, S3_ACCESS_KEY, S3_SECRET_KEY

services:
  nginx:
    image: nginx:alpine
    container_name: helios_nginx
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      # Use nginx.prod.conf for HTTPS, or nginx.conf for HTTP-only
      - ./nginx/${NGINX_CONFIG:-nginx.conf}:/etc/nginx/conf.d/default.conf:ro
      # SSL certificates (required for HTTPS)
      # Option 1: Manual certs in nginx/ssl/
      - ./nginx/ssl:/etc/nginx/ssl:ro
      # Option 2: Let's Encrypt certs (uncomment and adjust path)
      # - /etc/letsencrypt:/etc/letsencrypt:ro
      # - ./certbot/www:/var/www/certbot:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - helios_network
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: helios_postgres
    # NO ports exposed - internal only
    environment:
      POSTGRES_DB: ${DB_NAME:-helios}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema_organization.sql:/docker-entrypoint-initdb.d/01-schema.sql
    networks:
      - helios_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: helios_redis
    # NO ports exposed - internal only
    # Note: No password by default for simplicity. Set REDIS_PASSWORD in .env for production.
    networks:
      - helios_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: helios_minio
    command: server /data --console-address ":9001"
    # NO ports exposed - internal only (backend proxies all requests)
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
    volumes:
      - minio_data:/data
    networks:
      - helios_network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    # `image:` alongside `build:` so this stack can EITHER pull the CI-built
    # image (docker compose pull) or build from source (docker compose build).
    # Without an image ref there is nothing to pull and every host has to build
    # locally — which also hid the fact that CI had not published a Helios image
    # since 2026-08-11 (the ghcr push was 403ing on a bad image path).
    image: ghcr.io/obilabs/helios/backend:${HELIOS_VERSION:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
      # @obilabs/licensing is public on npmjs — no token. Build with plain:
      # docker compose build backend
    container_name: helios_backend
    # NO ports exposed - internal only (nginx proxies /api requests)
    environment:
      NODE_ENV: production
      PORT: 3001

      # Database (internal postgres, no SSL needed)
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-helios}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_SSL: "false"

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}

      # Security (REQUIRED in production)
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      REFRESH_TOKEN_EXPIRES_IN: ${REFRESH_TOKEN_EXPIRES_IN:-7d}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      EMAIL_ENCRYPTION_KEY: ${EMAIL_ENCRYPTION_KEY:?EMAIL_ENCRYPTION_KEY is required}

      # URLs - use PUBLIC_URL for asset URLs, empty = relative URLs
      PUBLIC_URL: ${PUBLIC_URL:-}
      FRONTEND_URL: ${FRONTEND_URL:-}

      # MinIO S3 (internal network)
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
      S3_BUCKET_PRIVATE: ${S3_BUCKET_PRIVATE:-helios-uploads}
      S3_BUCKET_PUBLIC: ${S3_BUCKET_PUBLIC:-helios-public}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_USE_SSL: "false"
      # S3_PUBLIC_URL not needed - backend proxies all asset requests

      # Rate limiting
      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-100}

      # Default admin (optional - if not set, setup wizard is shown)
      # Set these to skip the setup wizard and create admin on first startup
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:-}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-}
      DEFAULT_ORG_NAME: ${DEFAULT_ORG_NAME:-}
      DEFAULT_ORG_DOMAIN: ${DEFAULT_ORG_DOMAIN:-}

    volumes:
      # Mount schema file for database initialization
      - ./database/schema_organization.sql:/app/database/schema_organization.sql:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - helios_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  frontend:
    # See the note on `backend` — pullable image ref with a local build fallback.
    image: ghcr.io/obilabs/helios/frontend:${HELIOS_VERSION:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: ""  # Empty = relative URLs via nginx
        VITE_DEFAULT_THEME: ${VITE_DEFAULT_THEME:-helios-purple}
    container_name: helios_frontend
    # NO ports exposed - internal only (nginx proxies / requests)
    networks:
      - helios_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

volumes:
  postgres_data:
    name: helios_postgres_data
  minio_data:
    name: helios_minio_data

networks:
  helios_network:
    name: helios_network
    driver: bridge
