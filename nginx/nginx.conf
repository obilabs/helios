# Docker's embedded DNS. The upstreams below are re-resolved, so when the
# backend or frontend container is recreated (an image upgrade, a restart with
# a new address) the proxy follows it instead of answering 502 until it is
# restarted itself. Needs nginx 1.27.3 or later.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream frontend {
    zone helios_frontend 64k;
    server frontend:3000 resolve;
}

upstream backend {
    zone helios_backend 64k;
    server backend:3001 resolve;
}

server {
    listen 80;
    server_name _;

    # Hide nginx version
    server_tokens off;

    # Custom error pages for service unavailability
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html/error-pages;
        internal;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Increase timeouts for development
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Cache-busting: HTML files should not be cached
    location ~* \.(html)$ {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Cache static assets with long expiry (they have hashed filenames)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # API routes - proxy to backend
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        # Lifecycle actions (offboarding with a Drive/Calendar transfer) poll
        # Google to completion inside the request; 60 s cut them off and the
        # wizard reported "Failed to initiate" while the backend kept going.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Public asset proxy - serves files from MinIO via backend
    # URL format: /a/{token}/{filename}
    # ^~ so that a link ending in .png or .jpg is not taken by the static-file rule above.
    location ^~ /a/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Asset caching - let browser cache public assets
        proxy_cache_valid 200 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # Backend health check
    location /health {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # WebSocket for Socket.IO (bulk operations, real-time updates)
    location /socket.io/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket timeout - keep connections alive
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # WebSocket support for Vite HMR in development
    location /@vite/ {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location /__vite_ping {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Frontend - proxy to Vite dev server
    # For SPA, all non-API/non-asset routes go to the frontend
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # SPA fallback: if Vite returns 404, serve the root index
        proxy_intercept_errors on;
        error_page 404 = @spa_fallback;
    }

    # SPA fallback location - serves root for all unmatched routes
    location @spa_fallback {
        # Rewrite all unmatched routes to root for SPA
        rewrite ^(.*)$ / break;
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
